<link

<style>
  :root,
  [data-bs-theme="light"] {
    --color-textAccent1: #27764b;
    --color-textAccent2: #45acec;
  }

  [data-bs-theme="dark"] {
    --color-textAccent1: #87baa8;
    --color-textAccent2: #45acec;
  }

  .header {
    display: flex;
    flex-direction: row;
  }
  .header h1 {
    margin: 0;
    font-size: 2.5rem;
    color: var(--color-textAccent1);
  }
  .header .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 0.5rem;
    /* padding-bottom: 1rem; */
  }
  .header .logo-link svg {
    width: 40px;
    height: 40px;
  }
  .header .logo-link:hover svg polygon {
    fill: var(--color-grey);
  }
  .card {
    background: var(--bg-secondary-color);
  }
</style>
<script>
  if (
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches
  ) {
    document.body.setAttribute("data-bs-theme", "dark");
  } else {
    document.body.setAttribute("data-bs-theme", "light");
  }
</script>
