<link
  rel="stylesheet"
  href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.css"
/>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap");
  :root {
    --primary-color: #b75eff;
    --secondary-color: #00b2e8;

    --color-textAccent1: var(--primary-color);
    --color-textAccent2: var(--secondary-color);
  }

  [data-bs-theme="dark"] {
    --primary-color: #b75eff;
    --secondary-color: #00b2e8;

    --bs-font-monospace: "Space Mono", SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
    --bs-body-font-family: var(--bs-font-monospace);

    --bs-body-bg: var(--bs-black);
    --bs-body-bg-rgb: var(--bs-black-rgb);
    --bs-tertiary-bg: var(--bs-gray-700);
    --bs-tertiary-bg-rgb: var(--bs-gray-700-rgb);

    .btn-primary {
      --bs-btn-color: #fff;
      --bs-btn-bg: var(--primary-color);
      --bs-btn-border-color: var(--primary-color);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #00b2e8;
      --bs-btn-hover-border-color: #0a58ca;
      --bs-btn-focus-shadow-rgb: 49, 132, 253;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: #0a58ca;
      --bs-btn-active-border-color: #0a53be;
      --bs-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.125);
      --bs-btn-disabled-color: #fff;
      --bs-btn-disabled-bg: #0d6efd;
      --bs-btn-disabled-border-color: #0d6efd;
    }
  }

  [data-bs-theme="light"] {
    --fake: 1;
  }

  .header {
    display: flex;
    flex-direction: row;
    align-items: center;
    /*  padding: 0.5rem 0rem; */
  }
  .header h1 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--color-textAccent1);
    flex-grow: 1;
  }
  .header .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 0.5rem;
  }
  .header .logo-link svg {
    width: 30px;
    height: 30px;
  }
  .header .logo-link:hover svg polygon {
    fill: var(--pico-primary-hover-background);
  }
</style>
<script>
  if (
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches
  ) {
    document.body.setAttribute("data-bs-theme", "dark");
  } else {
    document.body.setAttribute("data-bs-theme", "light");
  }
</script>
