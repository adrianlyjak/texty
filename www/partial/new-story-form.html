<div class="container">
  <div id="form-alerts"></div>
  <div class="row align-items-stretch">
    <div class="col-md-6">
      <section class="h-100 d-flex flex-column">
        <h4>Select a Template</h4>
        <p>
          Choose from one of our pre-made story templates to get started
          quickly.
        </p>
        <form
          hx-post="/games/create"
          hx-target="#form-alerts"
          class="d-flex flex-column justify-content-between flex-grow-1"
        >
          <div class="mb-3">
            <label for="template" class="form-label">Template</label>
            <select class="form-select" name="template" id="template">
              <option value="fantasy-adventure">
                Fantasy Adventure: A brave hero embarks on a perilous quest to
                save the kingdom.
              </option>
              <option value="sci-fi-exploration">
                Sci-Fi Exploration: A crew of space explorers discovers a
                mysterious alien artifact.
              </option>
              <option value="detective-mystery">
                Detective Mystery: A brilliant detective must solve a baffling
                murder case.
              </option>
              <option value="post-apocalyptic-survival">
                Post-Apocalyptic Survival: Survivors struggle to rebuild society
                after a global catastrophe.
              </option>
              <option value="historical-drama">
                Historical Drama: A family navigates the challenges of a pivotal
                moment in history.
              </option>
            </select>
          </div>
          <button type="submit" class="btn btn-lg btn-primary">Start</button>
        </form>
      </section>
    </div>
    <div class="col-md-6">
      <section class="h-100 d-flex flex-column">
        <h4>Or Create Your Own</h4>
        <p>Alternatively, you can create your own custom story premise.</p>
        <form
          hx-post="/games/create"
          hx-target="#form-alerts"
          class="d-flex flex-column justify-content-between flex-grow-1"
        >
          <div class="mb-3">
            <label for="prompt" class="form-label">Premise</label>
            <textarea
              class="form-control"
              name="prompt"
              id="prompt"
              rows="6"
              placeholder="Describe the game"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-lg btn-primary">Start</button>
        </form>
      </section>
    </div>
  </div>
</div>
