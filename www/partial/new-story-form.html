<div class="container">
  <div id="form-alerts"></div>
  <div class="row align-items-stretch">
    <div class="col-md-6">
      <section class="h-100 d-flex flex-column">
        <h4>Select a Template</h4>
        <p>
          Choose from one of our pre-made story templates to get started
          quickly.
        </p>
        <form hx-post="/games/create" hx-target="#form-alerts" class="d-flex flex-column">
          <div class="mb-3">
            <label for="template" class="form-label">Template</label>
            <div class="form-text">
              <ul class="list-unstyled">
                <li>
                  <input
                    type="radio"
                    name="template"
                    id="fantasy-adventure"
                    value="fantasy-adventure"
                    class="form-check-input"
                  />
                  <label for="fantasy-adventure" class="form-check-label"
                    >Fantasy Adventure: A brave hero embarks on a perilous quest
                    to save the kingdom.</label
                  >
                </li>
                <li>
                  <input
                    type="radio"
                    name="template"
                    id="sci-fi-exploration"
                    value="sci-fi-exploration"
                    class="form-check-input"
                  />
                  <label for="sci-fi-exploration" class="form-check-label"
                    >Sci-Fi Exploration: A crew of space explorers discovers a
                    mysterious alien artifact.</label
                  >
                </li>
                <li>
                  <input
                    type="radio"
                    name="template"
                    id="detective-mystery"
                    value="detective-mystery"
                    class="form-check-input"
                  />
                  <label for="detective-mystery" class="form-check-label"
                    >Detective Mystery: A brilliant detective must solve a
                    baffling murder case.</label
                  >
                </li>
                <li>
                  <input
                    type="radio"
                    name="template"
                    id="post-apocalyptic-survival"
                    value="post-apocalyptic-survival"
                    class="form-check-input"
                  />
                  <label
                    for="post-apocalyptic-survival"
                    class="form-check-label"
                    >Post-Apocalyptic Survival: Survivors struggle to rebuild
                    society after a global catastrophe.</label
                  >
                </li>
                <li>
                  <input
                    type="radio"
                    name="template"
                    id="historical-drama"
                    value="historical-drama"
                    class="form-check-input"
                  />
                  <label for="historical-drama" class="form-check-label"
                    >Historical Drama: A family navigates the challenges of a
                    pivotal moment in history.</label
                  >
                </li>
              </ul>
            </div>
          </div>
          <button type="submit" class="btn btn-lg btn-primary">Start</button>
        </form>
      </section>
    </div>
    <div class="col-md-6">
      <section class="h-100 d-flex flex-column">
        <h4>Or Create Your Own</h4>
        <p>Alternatively, you can create your own custom story premise.</p>
        <form hx-post="/games/create" hx-target="#form-alerts" class="d-flex flex-column justify-content-end flex-grow-1">
          <div class="mb-3">
            <label for="prompt" class="form-label">Premise</label>
            <textarea
              class="form-control"
              name="prompt"
              id="prompt"
              rows="6"
              placeholder="Describe the game"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-lg btn-primary">Start</button>
        </form>
      </section>
    </div>
  </div>
</div>
